services:
  runner:
    build: ./codeiq-runner
    ports:
      - "8000:8080"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5200:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/codeiq.db
      Runner__BaseUrl: http://runner:8000
      Cors__Origins__0: http://localhost:3000
    volumes:
      - codeiq-data:/data
    depends_on:
      - runner

volumes:
  codeiq-data:
